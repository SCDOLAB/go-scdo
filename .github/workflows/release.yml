name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Install mingw for Windows cgo
        if: matrix.goos == 'windows'
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: Build node and client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -mod=vendor -o "dist/scdo-node-${GOOS}-${GOARCH}${ext}" ./cmd/node
          go build -mod=vendor -o "dist/scdo-client-${GOOS}-${GOARCH}${ext}" ./cmd/client
          if [ "$GOOS" = "linux" ]; then ./dist/scdo-node-${GOOS}-${GOARCH} -v; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
